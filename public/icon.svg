<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1628"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>

    <!-- Arc gradient: blue → cyan -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Needle glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Outer ring glow -->
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer speed arc (220° sweep, bottom-left to top-right) -->
  <!-- Arc path: start at 220° (bottom-left), sweep 220° counter-clockwise -->
  <path
    d="M 101 370 A 175 175 0 1 1 411 370"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="22"
    stroke-linecap="round"
    filter="url(#arcGlow)"
    opacity="0.9"
  />

  <!-- Inner track (dimmed) -->
  <path
    d="M 120 370 A 155 155 0 1 1 392 370"
    fill="none"
    stroke="#1e2a40"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Speedometer needle — pointing to ~75% (fast!) -->
  <!-- Pivot at 256,270; needle rotated ~-50° from bottom -->
  <g transform="translate(256,270)" filter="url(#glow)">
    <!-- Needle shaft -->
    <line
      x1="0" y1="0"
      x2="-110" y2="-130"
      stroke="#06b6d4"
      stroke-width="8"
      stroke-linecap="round"
    />
    <!-- Needle tip glow dot -->
    <circle cx="-110" cy="-130" r="8" fill="#06b6d4" opacity="0.9"/>
    <!-- Pivot cap -->
    <circle cx="0" cy="0" r="16" fill="#1e2a40" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#06b6d4"/>
  </g>

  <!-- WiFi pulse rings below needle (3 arcs, bottom-center) -->
  <g transform="translate(256,340)" opacity="0.85">
    <!-- Outer ring -->
    <path d="M -52 0 A 52 52 0 0 1 52 0"
      fill="none" stroke="#3b82f6" stroke-width="7"
      stroke-linecap="round"/>
    <!-- Middle ring -->
    <path d="M -34 0 A 34 34 0 0 1 34 0"
      fill="none" stroke="#06b6d4" stroke-width="7"
      stroke-linecap="round"/>
    <!-- Inner ring -->
    <path d="M -17 0 A 17 17 0 0 1 17 0"
      fill="none" stroke="#06b6d4" stroke-width="7"
      stroke-linecap="round"/>
    <!-- Dot -->
    <circle cx="0" cy="0" r="5" fill="#06b6d4"/>
  </g>
</svg>
