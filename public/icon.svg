<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- White background with rounded corners -->
  <rect width="512" height="512" rx="96" fill="#ffffff"/>

  <!-- Speedometer arc — blue base -->
  <path d="M 80 370 A 196 196 0 1 1 432 370"
    fill="none" stroke="#2563eb" stroke-width="28"
    stroke-linecap="round"/>

  <!-- Cyan fast-side accent -->
  <path d="M 300 60 A 196 196 0 0 1 432 370"
    fill="none" stroke="#0891b2" stroke-width="28"
    stroke-linecap="round"/>

  <!-- Purple slow-side accent -->
  <path d="M 80 370 A 196 196 0 0 1 116 178"
    fill="none" stroke="#7c3aed" stroke-width="28"
    stroke-linecap="round"/>

  <!-- Needle -->
  <line x1="256" y1="275" x2="336" y2="148"
    stroke="#0891b2" stroke-width="18"
    stroke-linecap="round" filter="url(#glow)"/>

  <!-- Needle tip -->
  <circle cx="336" cy="148" r="14" fill="#0891b2"/>

  <!-- Pivot -->
  <circle cx="256" cy="275" r="28" fill="#e0f2fe" stroke="#2563eb" stroke-width="7"/>
  <circle cx="256" cy="275" r="11" fill="#1d4ed8"/>

  <!-- WiFi rings -->
  <path d="M 158 400 A 104 104 0 0 1 354 400"
    fill="none" stroke="#2563eb" stroke-width="20" stroke-linecap="round"/>
  <path d="M 193 400 A 66 66 0 0 1 319 400"
    fill="none" stroke="#0891b2" stroke-width="20" stroke-linecap="round"/>
  <path d="M 226 400 A 32 32 0 0 1 286 400"
    fill="none" stroke="#0891b2" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="400" r="12" fill="#0891b2"/>
</svg>
